<div class="extension_settings" id="relations_tracker_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-heart" style="color: #ff4b4b; margin-right: 5px;"></i> Relations Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="display: none;">
            <div class="rt-body">
                <!-- Settings -->
                <div class="inline-drawer">
                    <div class="inline-drawer-toggle inline-drawer-header">
                        <b><i class="fa-solid fa-gear" style="margin-right: 5px;"></i> Settings</b>
                        <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
                    </div>
                    <div class="inline-drawer-content rt-settings-section" style="display: none;">
                        <label style="margin-bottom: 2px; font-weight: 600; font-size: 0.8em; color: var(--grey50);">AI MODE</label>
                        <div class="rt-mode-toggle">
                            <button class="menu_button rt-mode-btn" data-mode="manual">Manual</button>
                            <button class="menu_button rt-mode-btn active" data-mode="auto">Auto</button>
                            <button class="menu_button rt-mode-btn" data-mode="hybrid">Hybrid</button>
                        </div>
                        <div class="rt-row" style="margin-top: 6px;">
                            <label><input type="checkbox" id="rt-smart-scan" checked /> Smart Scan</label>
                            <label><input type="checkbox" id="rt-debug" /> Debug</label>
                        </div>
                        <div class="rt-row" style="margin-top: 5px;">
                            <div class="rt-field-group flex1">
                                <label>Depth</label>
                                <input type="number" class="text_pole" id="rt-scan-depth" value="10" min="1" max="100">
                            </div>
                            <div class="rt-field-group flex1">
                                <label>Language</label>
                                <select id="rt-prompt-lang" class="text_pole">
                                    <option value="EN">EN</option>
                                    <option value="RU">RU</option>
                                    <option value="UK">UK</option>
                                </select>
                            </div>
                        </div>
                        <div class="rt-row" style="margin-top: 5px;">
                            <div class="rt-field-group" style="width: 100%;">
                                <label>Connection Profile</label>
                                <select id="rt-connection-profile" class="text_pole">
                                    <option value="">-- Main API --</option>
                                </select>
                            </div>
                        </div>
                        <hr>
                        <div class="rt-row" style="margin-top: 10px;">
                            <div id="rt-install-regex-btn" class="menu_button interactable" style="width: 100%; text-align: center;">
                                <i class="fa-solid fa-code"></i> Auto-Install Regex Rules
                            </div>
                            <small style="color: var(--grey50); display: block; text-align: center; margin-top: 5px;">Adds rules to beautifully format and hide system events.</small>
                        </div>
                    </div>
                </div>

                <!-- Custom Bonds -->
                <div class="inline-drawer">
                    <div class="inline-drawer-toggle inline-drawer-header">
                        <b><i class="fa-solid fa-link" style="margin-right: 5px;"></i> Custom Bonds</b>
                        <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
                    </div>
                    <div class="inline-drawer-content rt-settings-section" style="display: none; padding-top: 10px;">
                        <div id="rt-custom-bonds-list" style="display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto;"></div>
                        <div class="rt-row" style="margin-top: 10px; display: flex; gap: 5px;">
                            <input type="text" id="rt-cb-code" class="text_pole" placeholder="[Tag]" style="flex: 1;" title="Tag, e.g. [M]">
                            <input type="text" id="rt-cb-name" class="text_pole" placeholder="Name" style="flex: 2;" title="Display Name, e.g. Mentor">
                            <input type="color" id="rt-cb-color" value="#a29bfe" style="flex: 1; height: 30px; border: none; background: transparent; cursor: pointer;">
                            <button id="rt-cb-add" class="menu_button interactable" style="flex: 1;"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <div class="rt-row" style="margin-top: 5px; display: flex; gap: 5px;">
                            <input type="text" id="rt-cb-behavior" class="text_pole" placeholder="Hint (or leave blank) -> click Generate" style="flex: 1;">
                            <button id="rt-cb-generate" class="menu_button interactable" style="flex: 0 0 auto; white-space: nowrap; padding: 0 10px;"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
                        </div>
                        <div id="rt-cb-options" style="display: none; flex-direction: column; gap: 5px; margin-top: 5px;"></div>
                    </div>
                </div>

                <!-- Memory & Gallery -->
                <div class="inline-drawer">
                    <div class="inline-drawer-toggle inline-drawer-header">
                        <b><i class="fa-solid fa-book" style="margin-right: 5px;"></i> Memory & Gallery</b>
                        <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
                    </div>
                    <div class="inline-drawer-content rt-settings-section" style="display: none;">
                        <div class="rt-row" style="margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin-bottom: 0; font-weight: 600; font-size: 0.8em; color: var(--grey50);">NL MEMORY (MINI-LOREBOOK)</label>
                            <select id="rt-resume-length" class="text_pole" style="width: auto; padding: 2px 5px; font-size: 0.8em;">
                                <option value="short">Short (1-2 sentences)</option>
                                <option value="medium">Medium (2-3 sent. per char)</option>
                                <option value="detailed">Detailed (Full paragraph per char)</option>
                            </select>
                        </div>
                        <div id="rt-nl-resume-cards" style="display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 5px;">
                            <div style="text-align: center; color: var(--grey50); font-size: 0.8em; font-style: italic; padding: 10px;">AI will generate character cards here...</div>
                        </div>
                        
                        <label style="margin-bottom: 2px; margin-top: 10px; font-weight: 600; font-size: 0.8em; color: var(--grey50);">MILESTONES GALLERY</label>
                        <div id="rt-gallery-container" style="max-height: 250px; overflow-y: auto; background: var(--SmartThemeBlurTintColor, rgba(0,0,0,0.2)); border: 1px solid var(--SmartThemeBorderColor, rgba(255,255,255,0.1)); border-radius: 5px; padding: 8px;">
                            <div style="text-align: center; color: var(--grey50); font-size: 0.8em;">No milestones recorded yet.</div>
                        </div>
                    </div>
                </div>

                <!-- Hybrid Banner -->
                <div id="rt-hybrid-banner" class="rt-hybrid-banner" style="display: none;">
                    <div class="rt-hybrid-title"><i class="fa-solid fa-robot"></i> AI Suggestion</div>
                    <div id="rt-hybrid-summary" class="rt-hybrid-summary"></div>
                    <div class="rt-hybrid-actions">
                        <button id="rt-hybrid-apply" class="menu_button interactable rt-hybrid-apply"><i class="fa-solid fa-check"></i> Apply</button>
                        <button id="rt-hybrid-dismiss" class="menu_button interactable rt-hybrid-dismiss"><i class="fa-solid fa-xmark"></i> Dismiss</button>
                    </div>
                </div>

                <!-- Cards -->
                <div id="rt-cards-container" class="rt-cards-container">
                    <div class="rt-empty-state">No relationships. Click "Add" or "Scan".</div>
                </div>

                <!-- Bottom Controls -->
                <div class="rt-controls">
                    <button id="rt-add-btn" class="menu_button interactable"><i class="fa-solid fa-plus"></i> Add</button>
                    <button id="rt-refresh-btn" class="menu_button interactable"><i class="fa-solid fa-rotate-right"></i> Scan</button>
                    <button id="rt-graph-btn" class="menu_button interactable"><i class="fa-solid fa-diagram-project"></i> Graph</button>
                    <button id="rt-export-btn" class="menu_button interactable"><i class="fa-solid fa-file-export"></i> Export</button>
                    <button id="rt-import-btn" class="menu_button interactable"><i class="fa-solid fa-file-import"></i> Import</button>
                </div>
                <input type="file" id="rt-import-file" accept=".json" style="display: none;">
            </div>
        </div>
    </div>
</div>

<!-- Graph Popup -->
<div id="rt-graph-popup" class="rt-graph-popup" style="display: none;">
    <div class="rt-graph-header">
        <span><i class="fa-solid fa-diagram-project"></i> Relationship Graph</span>
        <div id="rt-graph-close" class="rt-graph-close fa-solid fa-xmark"></div>
    </div>
    <canvas id="rt-graph-canvas" width="600" height="400"></canvas>
    <div id="rt-graph-tooltip" class="rt-graph-tooltip" style="display: none;"></div>
</div>

<!-- Floating Widget -->
<div id="rt-float-widget" class="rt-float-widget" style="display: none;">
    <div class="rt-float-icon"><i class="fa-solid fa-heart"></i></div>
    <div class="rt-float-panel" style="display: none;">
        <div class="rt-float-title">Relations</div>
        <div id="rt-float-list" class="rt-float-list"></div>
    </div>
</div>

<template id="rt-card-template">
    <div class="rt-card">
        <div class="rt-card-header">
            <div class="rt-names">
                <span class="rt-source" contenteditable="true" title="Click to edit">Name</span>
                <i class="fa-solid fa-arrow-right rt-arrow"></i>
                <span class="rt-target" contenteditable="true" title="Click to edit">Target</span>
            </div>
            <div class="rt-card-actions">
                <span class="rt-bond-label" data-bond="[P]"></span>
                <label class="rt-lock-label" title="Lock: AI cannot change bond type"><input type="checkbox" class="rt-lock" /> <i class="fa-solid fa-lock"></i></label>
                <div class="rt-history-toggle fa-solid fa-clock-rotate-left" title="History"></div>
                <div class="rt-delete-btn fa-solid fa-trash" title="Delete"></div>
            </div>
        </div>

        <div class="rt-history-panel" style="display: none;">
            <div class="rt-history-content"><div class="rt-history-empty">No history yet.</div></div>
        </div>

        <div class="rt-card-body">
            <div class="rt-row flex-container">
                <div class="rt-field-group flex1">
                    <label>Bond</label>
                    <select class="text_pole rt-bond-type">
                        <option value="[R]">💋 Romantic</option>
                        <option value="[P]">🤝 Platonic</option>
                        <option value="[PL]">💛 Platonic Love</option>
                        <option value="[F]">🏠 Family</option>
                        <option value="[H]">⚔ Hostile</option>
                        <option value="[C]">🌀 Complicated</option>
                    </select>
                </div>
                <div class="rt-field-group flex1">
                    <label>Tier</label>
                    <select class="text_pole rt-tier">
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>

            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <label>Label</label>
                    <div class="rt-label-wrapper">
                        <input type="text" class="text_pole rt-label" placeholder="How they feel...">
                        <select class="rt-label-presets" title="Presets">
                            <option value="">✦</option>
                            <optgroup label="Romantic">
                                <option value="Strangers with tension">Strangers with tension</option>
                                <option value="Flirting stage">Flirting stage</option>
                                <option value="Mutual crush">Mutual crush</option>
                                <option value="Deeply in love">Deeply in love</option>
                            </optgroup>
                            <optgroup label="Platonic">
                                <option value="Just met">Just met</option>
                                <option value="Acquaintances">Acquaintances</option>
                                <option value="Good friends">Good friends</option>
                                <option value="Best friends">Best friends</option>
                            </optgroup>
                            <optgroup label="Family">
                                <option value="Estranged">Estranged</option>
                                <option value="Family bond">Family bond</option>
                                <option value="Protective bond">Protective bond</option>
                                <option value="Unbreakable">Unbreakable</option>
                            </optgroup>
                            <optgroup label="Hostile">
                                <option value="Mild annoyance">Mild annoyance</option>
                                <option value="Rivals">Rivals</option>
                                <option value="Sworn enemies">Sworn enemies</option>
                                <option value="Blood feud">Blood feud</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>

            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <div class="rt-cp-display">
                        <label>CP</label>
                        <span class="rt-cp-value">0</span>
                    </div>
                    <input type="range" min="-100" max="100" value="0" class="rt-cp-slider">
                </div>
            </div>
        </div>
    </div>
</template>

<div class="extension_settings" id="relations_tracker_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-heart" style="color: #ff4b4b; margin-right: 5px;"></i> Relations Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="display: none;">
            
            <div class="rt-body">
                <!-- Settings Section -->
                <div class="inline-drawer">
                    <div class="inline-drawer-toggle inline-drawer-header">
                        <b><i class="fa-solid fa-gear" style="margin-right: 5px;"></i> Settings</b>
                        <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
                    </div>
                    <div class="inline-drawer-content rt-settings-section" style="display: none;">
                        <div class="rt-row" style="align-items: center; justify-content: space-between;">
                            <label title="Automatically evaluate relationships using AI in the background after each message"><input type="checkbox" id="rt-auto-ai" /> Auto AI Mode</label>
                            <label title="Show debug information and JSON responses in console"><input type="checkbox" id="rt-debug" /> Debug</label>
                        </div>
                        
                        <div class="rt-row" style="margin-top: 5px;">
                            <div class="rt-field-group flex1">
                                <label title="Number of recent messages to analyze">Context Depth</label>
                                <input type="number" class="text_pole" id="rt-scan-depth" value="5" min="1" max="100">
                            </div>
                            <div class="rt-field-group flex1">
                                <label>Prompt Language</label>
                                <select id="rt-prompt-lang" class="text_pole">
                                    <option value="EN">English</option>
                                    <option value="RU">Russian</option>
                                    <option value="UK">Ukrainian</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="rt-row" style="margin-top: 5px;">
                            <div class="rt-field-group" style="width: 100%;">
                                <label>Connection Profile</label>
                                <select id="rt-connection-profile" class="text_pole">
                                    <option value="">-- Use Main API --</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cards Container -->
                <div id="rt-cards-container" class="rt-cards-container">
                    <div class="rt-empty-state">No relationship data. Open a chat and click "Add" or "Scan Chat".</div>
                </div>
                
                <!-- Bottom Controls -->
                <div class="rt-controls">
                    <button id="rt-add-btn" class="menu_button interactable" style="flex: 1; margin-right: 5px;">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                    <button id="rt-refresh-btn" class="menu_button interactable" style="flex: 1; margin-left: 5px;">
                        <i class="fa-solid fa-rotate-right"></i> Scan Chat
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<template id="rt-card-template">
    <div class="rt-card">
        <div class="rt-card-header">
            <div class="rt-names">
                <span class="rt-source" contenteditable="true" data-field="source" title="Click to edit">Name</span>
                <i class="fa-solid fa-arrow-right"></i>
                <span class="rt-target" contenteditable="true" data-field="target" title="Click to edit">Target</span>
                <span class="rt-bond-label" data-bond="[P]"></span>
            </div>
            <div class="rt-delete-btn fa-solid fa-trash" title="Delete"></div>
        </div>
        
        <div class="rt-card-body">
            <div class="rt-row flex-container">
                <div class="rt-field-group flex1">
                    <label>Bond Type</label>
                    <select class="text_pole rt-bond-type" data-field="bond">
                        <option value="[R]">❤ Romantic</option>
                        <option value="[P]">🤝 Platonic</option>
                        <option value="[F]">🏠 Family</option>
                        <option value="[H]">⚔ Hostile</option>
                    </select>
                </div>
                
                <div class="rt-field-group flex1">
                    <label>Tier</label>
                    <select class="text_pole rt-tier" data-field="tier">
                        <option value="Frozen">🧊 Frozen</option>
                        <option value="Cold">❄ Cold</option>
                        <option value="Distant">🌫 Distant</option>
                        <option value="Neutral" selected>⚖ Neutral</option>
                        <option value="Warm">☀ Warm</option>
                        <option value="Close">🔥 Close</option>
                        <option value="Devoted">💎 Devoted</option>
                    </select>
                </div>
            </div>
            
            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <label>Label</label>
                    <div class="rt-label-wrapper">
                        <input type="text" class="text_pole rt-label" data-field="label" placeholder="How they feel about each other...">
                        <select class="rt-label-presets" title="Quick-fill label from presets">
                            <option value="">✦ Presets...</option>
                            <optgroup label="Romantic">
                                <option value="Strangers with tension">Strangers with tension</option>
                                <option value="Flirting stage">Flirting stage</option>
                                <option value="Mutual crush">Mutual crush</option>
                                <option value="Dating">Dating</option>
                                <option value="Deeply in love">Deeply in love</option>
                            </optgroup>
                            <optgroup label="Platonic">
                                <option value="Just met">Just met</option>
                                <option value="Acquaintances">Acquaintances</option>
                                <option value="Wary allies">Wary allies</option>
                                <option value="Good friends">Good friends</option>
                                <option value="Best friends">Best friends</option>
                            </optgroup>
                            <optgroup label="Family">
                                <option value="Estranged">Estranged</option>
                                <option value="Distant relatives">Distant relatives</option>
                                <option value="Family bond">Family bond</option>
                                <option value="Protective bond">Protective bond</option>
                                <option value="Unbreakable bond">Unbreakable bond</option>
                            </optgroup>
                            <optgroup label="Hostile">
                                <option value="Mild annoyance">Mild annoyance</option>
                                <option value="Rivals">Rivals</option>
                                <option value="Open conflict">Open conflict</option>
                                <option value="Sworn enemies">Sworn enemies</option>
                                <option value="Blood feud">Blood feud</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <div class="rt-cp-display">
                        <label>Charm Points (CP)</label>
                        <span class="rt-cp-value">0</span>
                    </div>
                    <input type="range" min="-100" max="100" value="0" class="rt-cp-slider" data-field="cp">
                </div>
            </div>
        </div>
    </div>
</template>

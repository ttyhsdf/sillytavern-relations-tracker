<div class="extension_settings" id="relations_tracker_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-heart" style="color: #ff4b4b; margin-right: 5px;"></i> Relations Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="display: none;">
            
            <div class="rt-body">
                <div class="rt-settings-section" style="padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; margin-bottom: 10px; border: 1px solid var(--SmartThemeQuoteColor);">
                    <div class="rt-row" style="align-items: center; justify-content: space-between;">
                        <label title="Automatically evaluate relationships using AI in the background after each message"><input type="checkbox" id="rt-auto-ai" /> Enable Auto AI Mode</label>
                        <label title="Show debug information and JSON responses in console"><input type="checkbox" id="rt-debug" /> Debug Mode</label>
                    </div>
                    
                    <div class="rt-row" style="margin-top: 10px;">
                        <div class="rt-field-group flex1">
                            <label title="Number of recent messages to analyze">Context Depth</label>
                            <input type="number" class="text_pole" id="rt-scan-depth" value="5" min="1" max="100">
                        </div>
                        <div class="rt-field-group flex1">
                            <label>Prompt Language</label>
                            <select id="rt-prompt-lang" class="text_pole">
                                <option value="EN">English</option>
                                <option value="RU">Russian</option>
                                <option value="UK">Ukrainian</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="rt-row" style="margin-top: 10px;">
                        <div class="rt-field-group" style="width: 100%;">
                            <label>Connection Profile (Optional API Override)</label>
                            <select id="rt-connection-profile" class="text_pole">
                                <option value="">-- Use Main API --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="rt-cards-container" class="rt-cards-container">
                    <!-- Cards will be injected here via JS -->
                    <div class="rt-empty-state">No relationship data found in chat history.</div>
                </div>
                
                <div class="rt-controls">
                    <button id="rt-add-btn" class="menu_button interactable" style="flex: 1; margin-right: 5px;">
                        <i class="fa-solid fa-plus"></i> Add Relationship
                    </button>
                    <button id="rt-refresh-btn" class="menu_button interactable" style="flex: 1; margin-left: 5px;">
                        <i class="fa-solid fa-rotate-right"></i> Scan Chat
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<template id="rt-card-template">
    <div class="rt-card">
        <div class="rt-card-header">
            <div class="rt-names">
                <span class="rt-source" contenteditable="true" data-field="source" title="Source Character">Name</span>
                <i class="fa-solid fa-arrow-right"></i>
                <span class="rt-target" contenteditable="true" data-field="target" title="Target Character/User">Target</span>
            </div>
            <div class="rt-delete-btn fa-solid fa-trash" title="Delete"></div>
        </div>
        
        <div class="rt-card-body">
            <div class="rt-row flex-container">
                <div class="rt-field-group flex1">
                    <label>Bond Type</label>
                    <select class="text_pole rt-bond-type" data-field="bond">
                        <option value="[R]">[R] Romantic</option>
                        <option value="[P]">[P] Platonic</option>
                        <option value="[F]">[F] Family</option>
                        <option value="[H]">[H] Hostile</option>
                    </select>
                </div>
                
                <div class="rt-field-group flex2">
                    <label>Tier</label>
                    <input type="text" class="text_pole rt-tier" data-field="tier" placeholder="Tier Name">
                </div>
            </div>
            
            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <label>Relationship Label</label>
                    <input type="text" class="text_pole rt-label" data-field="label" placeholder="Short description">
                </div>
            </div>
            
            <div class="rt-row">
                <div class="rt-field-group" style="width: 100%;">
                    <label style="display: flex; justify-content: space-between;">
                        <span>Charm Points (CP)</span>
                        <span class="rt-cp-value" style="font-weight: bold;">0</span>
                    </label>
                    <input type="range" min="-100" max="100" value="0" class="rt-cp-slider default" data-field="cp">
                </div>
            </div>
        </div>
    </div>
</template>

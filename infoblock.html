<div id="rt-infoblock" class="rt-infoblock-wrapper">
    <div id="rt-infoblock-btn" class="rt-infoblock-btn" title="View Relationships">
        <i class="fa-solid fa-heart"></i>
    </div>
    <div id="rt-infoblock-panel" class="rt-infoblock-panel" style="display: none;">
        <div class="rt-infoblock-header">
            <span><i class="fa-solid fa-heart" style="color:#ff6b81; margin-right:6px;"></i> Relationship Status</span>
            <div id="rt-infoblock-close" class="rt-infoblock-close fa-solid fa-xmark" title="Close"></div>
        </div>
        <div id="rt-ib-worldstate" class="rt-ib-worldstate" style="display:none;"></div>
        <div id="rt-infoblock-content" class="rt-infoblock-content">
            <!-- Content will be injected by JS -->
        </div>
    </div>
</div>
